spring:
  application:
    name: yu-ai-code-mother-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: 1234
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600   #过期时间
  # Session 配置
  session:
    store-type: redis
    timeout: 2592000   # session 30 天后过期
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yupi.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

