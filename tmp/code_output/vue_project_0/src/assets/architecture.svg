<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8aa0b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0c2a4a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="860" height="420" fill="#f7f9fb"/>
  <text x="32" y="38" font-size="20" font-weight="700" fill="#123a63">CodeArch 站点整体架构图</text>
  <text x="32" y="60" font-size="13" fill="#647689">浏览器端 → 网关 → 应用服务 → 数据与中间件 → 可观测性</text>

  <g filter="url(#sh)">
    <rect x="28" y="88" width="150" height="66" rx="10" fill="#ffffff" stroke="#d9e2ee"/>
    <text x="103" y="115" font-size="14" font-weight="700" fill="#123a63" text-anchor="middle">PC / H5 前端</text>
    <text x="103" y="136" font-size="12" fill="#647689" text-anchor="middle">Vue3 + Vite</text>
  </g>

  <g filter="url(#sh)">
    <rect x="28" y="174" width="150" height="66" rx="10" fill="#ffffff" stroke="#d9e2ee"/>
    <text x="103" y="201" font-size="14" font-weight="700" fill="#123a63" text-anchor="middle">小程序 / App</text>
    <text x="103" y="222" font-size="12" fill="#647689" text-anchor="middle">统一 API 协议</text>
  </g>

  <g filter="url(#sh)">
    <rect x="248" y="128" width="160" height="88" rx="10" fill="#1b3f8b"/>
    <text x="328" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">CDN + API 网关</text>
    <text x="328" y="182" font-size="12" fill="#bcd4f5" text-anchor="middle">限流 · 鉴权 · 灰度</text>
    <text x="328" y="200" font-size="12" fill="#bcd4f5" text-anchor="middle">Nginx / Kong</text>
  </g>

  <g filter="url(#sh)">
    <rect x="480" y="82" width="180" height="64" rx="10" fill="#ffffff" stroke="#22d3c5" stroke-width="2"/>
    <text x="570" y="107" font-size="14" font-weight="700" fill="#0d9488" text-anchor="middle">内容服务</text>
    <text x="570" y="128" font-size="12" fill="#647689" text-anchor="middle">文章 / 专栏 / 检索</text>
  </g>
  <g filter="url(#sh)">
    <rect x="480" y="160" width="180" height="64" rx="10" fill="#ffffff" stroke="#f7a83b" stroke-width="2"/>
    <text x="570" y="185" font-size="14" font-weight="700" fill="#b4741d" text-anchor="middle">用户与作者服务</text>
    <text x="570" y="206" font-size="12" fill="#647689" text-anchor="middle">投稿 / 审核 / 收益</text>
  </g>
  <g filter="url(#sh)">
    <rect x="480" y="238" width="180" height="64" rx="10" fill="#ffffff" stroke="#7c5cff" stroke-width="2"/>
    <text x="570" y="263" font-size="14" font-weight="700" fill="#5b3fd6" text-anchor="middle">互动服务</text>
    <text x="570" y="284" font-size="12" fill="#647689" text-anchor="middle">评论 / 点赞 / 通知</text>
  </g>

  <g filter="url(#sh)">
    <rect x="720" y="98" width="116" height="54" rx="10" fill="#eef2f8" stroke="#cbd7e6"/>
    <text x="778" y="131" font-size="13" font-weight="700" fill="#123a63" text-anchor="middle">MySQL</text>
  </g>
  <g filter="url(#sh)">
    <rect x="720" y="166" width="116" height="54" rx="10" fill="#eef2f8" stroke="#cbd7e6"/>
    <text x="778" y="199" font-size="13" font-weight="700" fill="#123a63" text-anchor="middle">Redis</text>
  </g>
  <g filter="url(#sh)">
    <rect x="720" y="234" width="116" height="54" rx="10" fill="#eef2f8" stroke="#cbd7e6"/>
    <text x="778" y="267" font-size="13" font-weight="700" fill="#123a63" text-anchor="middle">ES / OSS</text>
  </g>

  <g filter="url(#sh)">
    <rect x="248" y="300" width="412" height="52" rx="10" fill="#ffffff" stroke="#d9e2ee"/>
    <text x="454" y="331" font-size="13" font-weight="700" fill="#123a63" text-anchor="middle">消息队列 Kafka · 定时任务 · 全文检索 · 对象存储</text>
  </g>

  <g filter="url(#sh)">
    <rect x="248" y="368" width="588" height="40" rx="10" fill="#061527"/>
    <text x="542" y="393" font-size="12.5" fill="#7fe9df" text-anchor="middle">可观测性：Prometheus + Grafana + SkyWalking + ELK 日志体系</text>
  </g>

  <g stroke="#8aa0b8" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M178 121 L244 158"/>
    <path d="M178 207 L244 188"/>
    <path d="M408 148 L476 118"/>
    <path d="M408 172 L476 192"/>
    <path d="M408 196 L476 262"/>
    <path d="M660 114 L716 124"/>
    <path d="M660 192 L716 192"/>
    <path d="M660 268 L716 262"/>
    <path d="M328 216 L328 300"/>
    <path d="M454 352 L454 368"/>
  </g>
</svg>
